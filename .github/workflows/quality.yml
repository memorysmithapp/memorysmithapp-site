# The checks of what the documents promise about themselves and the version (scripts/quality.mjs),
# and their tests; then the type checks, the tests and the builds of the website and of its
# infrastructure. The job is named Quality, the status check the ruleset `main` requires.
name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is not on the PATH until Corepack is enabled, so setup-node cannot cache its store.
          package-manager-cache: false
      - name: Enable the pnpm pinned in package.json
        run: corepack enable
      - name: Check the documents and the version
        run: pnpm run quality
      - name: Test the checks
        run: pnpm test
      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Type-check the packages
        run: pnpm typecheck
      - name: Test the packages
        run: pnpm test:packages
      - name: Build the website
        run: pnpm -C memorysmithapp-site-frontend build
      # With the build in place, as a delivery synthesizes it, and with no AWS credentials.
      - name: Synthesize the infrastructure
        run: pnpm -C memorysmithapp-site-infra synth
